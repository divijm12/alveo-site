<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alveo · Coming soon</title>
<meta name="description" content="Alveo is an app for Mac and Windows that notices when you vape at your desk and helps you cut down, and possibly quit. Coming soon.">
<meta name="theme-color" content="#0a0a0b">
<meta property="og:title" content="Alveo">
<meta property="og:description" content="Notices when you vape at your desk and helps you cut down, and possibly quit. Coming soon to Mac and Windows.">
<meta property="og:image" content="https://getalveo.app/og-icon.png">
<meta property="og:url" content="https://getalveo.app/">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: dark; --bg: #0a0a0b; --ink: #f4f4f5; --ink-2: #a1a1aa; --red: #ff2d2d;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); display: grid; place-items: center;
    padding: 24px max(20px, env(safe-area-inset-left)) 24px max(20px, env(safe-area-inset-right));
    background-image: radial-gradient(ellipse 60% 45% at 50% 38%, rgba(255, 45, 45, .10), transparent 70%); }
  main { text-align: center; max-width: 34rem; display: grid; justify-items: center; gap: 18px; }
  img { width: clamp(120px, 28vw, 168px); height: auto; }
  h1 { font-size: clamp(2.6rem, 9vw, 3.6rem); letter-spacing: -.03em; margin: 4px 0 0; font-weight: 700; }
  p { margin: 0; color: var(--ink-2); font-size: clamp(1.05rem, 3.6vw, 1.2rem); line-height: 1.5; text-wrap: balance; }
  .soon { color: var(--red); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: .82rem;
    border: 1px solid rgba(255, 45, 45, .45); border-radius: 999px; padding: 6px 14px; margin-top: 6px; }
  footer { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    color: #52525b; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="Alveo app icon: lungs drawn as red dots on black" width="168" height="168">
  <h1>Alveo</h1>
  <p>An app that notices when you vape at your desk and helps you cut down, and possibly quit.</p>
  <span class="soon">Coming soon to Mac and Windows</span>
</main>
<footer>© 2026 Alveo</footer>
</body>
</html>
